<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Welcome</title>
<style>
  body {
    margin: 0; min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center;
    font-family: system-ui, sans-serif; background: #0d1117; color: #e6edf3;
    padding: 20px;
  }
  h1 { font-size: 2.5rem; margin-bottom: 30px; }
  #box {
    cursor: pointer; padding: 18px 28px; border: 2px dashed #58a6ff;
    border-radius: 10px; color: #58a6ff; font-size: 1.1rem; font-weight: 600;
    max-width: 500px; transition: background 0.2s;
  }
  #box:hover { background: rgba(88,166,255,0.08); }
  footer { margin-top: 40px; color: #8b949e; font-size: 0.9rem; }
  footer a { color: #58a6ff; }
</style>
</head>
<body>

  <h1>Welcome Folks</h1>

  <div id="box" onclick="showFact()">🎲 Click for a fun fact</div>

  <footer>
    Page was created using GitHub Pages.<br>
    Create your own at
    <a href="https://docs.github.com/en/pages/getting-started-with-github-pages" target="_blank">docs.github.com/pages</a>.
  </footer>

<script>
  var facts = [
    "The original Space Invaders got faster the fewer aliens were left, not by design, just because the computer had less to render.",
    "You could fit the entire text of Wikipedia on a USB stick smaller than your fingernail.",
    "The inventor of the computer mouse never made a cent in royalties from it.",
    "A Nintendo Switch has more computing power than the systems that sent humans to the Moon, combined, twice over.",
    "Somewhere right now, a vending machine is running Windows XP and nobody has patched it since 2014.",
    "The Konami Code, up up down down left right left right B A, still works as an Easter egg on dozens of major websites today.",
    "An email takes about 4 grams of CO2 to send. Attach a photo and it jumps to 50 grams.",
    "The password 123456 has shown up in data breaches over 23 million times.",
    "A programmer once automated his own job so well he got paid for six years doing basically nothing, until IT found out.",
    "reCAPTCHA's traffic light puzzles exist because AI got too good at reading text, so now it makes you prove you're human by doing chores."
  ];
  function showFact() {
    var box = document.getElementById('box');
    var fact = facts[Math.floor(Math.random() * facts.length)];
    box.textContent = "💡 " + fact;
  }
</script>

</body>
</html>
</script>

</body>
</html>
