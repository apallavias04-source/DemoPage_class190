<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Welcome</title>
<style>
  body {
    margin: 0; min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center;
    font-family: system-ui, sans-serif; background: #0d1117; color: #e6edf3;
    padding: 20px;
  }
  h1 { font-size: 2.5rem; margin-bottom: 30px; }
  #box {
    cursor: pointer; padding: 18px 28px; border: 2px dashed #58a6ff;
    border-radius: 10px; color: #58a6ff; font-size: 1.1rem; font-weight: 600;
    max-width: 500px; transition: background 0.2s;
  }
  #box:hover { background: rgba(88,166,255,0.08); }
  footer { margin-top: 40px; color: #8b949e; font-size: 0.9rem; }
  footer a { color: #58a6ff; }
</style>
</head>
<body>

  <h1>Welcome Folks</h1>

  <div id="box" onclick="showFact()">🎲 Click for a fun fact</div>

  <footer>
    Page created using GitHub Pages.<br>
    Create your own at
    <a href="https://docs.github.com/en/pages/getting-started-with-github-pages" target="_blank">docs.github.com/pages</a>.
  </footer>

<script>
  const facts = [
    "The first computer mouse was made of wood.",
    "More than 90% of the world's currency exists only as digital data.",
    "The first computer virus was created in 1983 as an experiment, not an attack.",
    "A single Google search uses more computing power than NASA used for the Apollo 11 moon landing.",
    "The QWERTY keyboard layout was designed to slow typists down and prevent jams on old typewriters.",
    "There are more possible chess games than atoms in the observable universe.",
    "The first 1GB hard drive, released in 1980, weighed over 500 pounds.",
    "Wi-Fi doesn't actually stand for anything — it's just a marketing name."
    "You could store the entire text of Wikipedia on a USB stick smaller than your fingernail.",
    "There's a database of every Wi-Fi password ever leaked, and yes, someone's is still 'password123'.",
    "Google once had a job listing that was literally just a hard math puzzle billboard, no company name, just to recruit nerds.",
    "The first computer virus spread through floppy disks passed around like Pokémon cards.",
    "Somewhere right now, a vending machine is running Windows XP and nobody has patched it since 2014.",
    "An email takes about 4 grams of CO2 to send. Attach a photo and it jumps to 50 grams, so yes, that meme you forwarded has a carbon footprint.",
    "The password '123456' has been leaked in data breaches over 23 million times. People really are that unserious.",
    "A programmer once automated his own job so well he got paid for six years while doing basically nothing, until IT found out.",
    "Some old Nokia phones have a battery life so absurd, NASA basically confirmed civilization could survive an apocalypse on a Nokia 3310.",
    "The reCAPTCHA 'click all the traffic lights' test exists because AI got too good at reading text, so now it makes you prove you're human by doing chores."
];
  ];
  function showFact() {
    const box = document.getElementById('box');
    const fact = facts[Math.floor(Math.random() * facts.length)];
    box.textContent = "💡 " + fact;
  }
</script>

</body>
</html>
